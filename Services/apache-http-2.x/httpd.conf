# APACHE2_CONFIG_DIRECTORY/httpd.conf


# Global environment settings.
ServerName SERVER_NAME.DOMAIN_NAME
ServerAdmin webmaster@DOMAIN_NAME
ServerSignature On
ServerTokens OS
ServerRoot "APACHE2_CONFIG_DIRECTORY"
DocumentRoot "APACHE2_DATA_DIRECTORY"
Timeout 128
KeepAlive Off
KeepAliveTimeout 16
MaxKeepAliveRequests 128
UseCanonicalName Off
HostnameLookups Off
Listen 80
User APACHE2_DAEMON_USER
Group APACHE2_DAEMON_GROUP
PidFile APACHE2_STATE_DIRECTORY/httpd.pid


# Prefork module.
<IfModule prefork.c>
    StartServers            4
    MinSpareServers         4
    MaxSpareServers        16
    ServerLimit           128
    MaxClients            128
    MaxRequestsPerChild  4096
</IfModule>

# Worker module.
<IfModule worker.c>
    StartServers           2
    MaxClients           128
    MinSpareThreads       16
    MaxSpareThreads      128  
    ThreadsPerChild       32
    MaxRequestsPerChild 4096 
</IfModule>

# Lnabled modules if any.
Include modules.conf

# Load ssl configuration.
Include ssl.conf

# First, we configure the "default" allowed options.
<Directory />
    Options Indexes FollowSymLinks Includes
    AllowOverride None
</Directory>

# This should be changed to whatever you set DocumentRoot to.
<Directory "APACHE2_DATA_DIRECTORY">
    Options Indexes FollowSymLinks Includes
    AllowOverride None
    Order allow,deny
    Allow from all
</Directory>

# DirectoryIndex: What files are opened by default?
DirectoryIndex index.html index.html.var

# AccessFileName: The name of the acl file to look for in each directory.
AccessFileName .htaccess

# Prevent .htaccess and .htpasswd files from being viewed by clients. 
<Files ~ "^\.ht">
    Order allow,deny
    Deny from all
</Files>

# TypesConfig describes where the mime.types file (or equivalent) is.
TypesConfig mime.types

# DefaultType is the default MIME type the server will use for a document
# if it cannot otherwise determine one, such as from filename extensions.
DefaultType text/plain

# The mod_mime_magic module allows the server to use various hints from the
# contents of the file itself to determine its type.
<IfModule mod_mime_magic.c>
    MIMEMagicFile mime.magic
</IfModule>

# Logging setup.
ErrorLog APACHE2_LOGGING_DIRECTORY/error_log
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
LogFormat "%h %l %u %t \"%r\" %>s %b" common
LogFormat "%{Referer}i -> %U" referer
LogFormat "%{User-agent}i" agent
CustomLog APACHE2_LOGGING_DIRECTORY/access_log combined

# Icons alias.
Alias /icons/ "APACHE2_ICONS_DIRECTORY/"
<Directory "APACHE2_ICONS_DIRECTORY">
    Options Indexes MultiViews
    AllowOverride None
    Order allow,deny
    Allow from all
</Directory>

# Location of the webdav lock database.
<IfModule mod_dav_fs.c>
    DAVLockDB /var/lib/dav/lockdb
</IfModule>

# Script directory location.
ScriptAlias /cgi-bin/ "APACHE2_CGIBIN_DIRECTORY/"
<Directory "APACHE2_CGIBIN_DIRECTORY">
    AllowOverride None
    Options None
    Order allow,deny
    Allow from all
</Directory>

# Control appearance of server-generated directory listings.
IndexOptions FancyIndexing VersionSort NameWidth=*

# AddIcon* directives tell the server which icon to show for different
# files or filename extensions. FancyIndexed directories only.
AddIconByEncoding (CMP,/icons/compressed.gif) x-compress x-gzip
AddIconByType (TXT,/icons/text.gif) text/*
AddIconByType (IMG,/icons/image2.gif) image/*
AddIconByType (SND,/icons/sound2.gif) audio/*
AddIconByType (VID,/icons/movie.gif) video/*
AddIcon /icons/binary.gif .bin .exe
AddIcon /icons/binhex.gif .hqx
AddIcon /icons/tar.gif .tar
AddIcon /icons/world2.gif .wrl .wrl.gz .vrml .vrm .iv
AddIcon /icons/compressed.gif .Z .z .tgz .gz .zip
AddIcon /icons/a.gif .ps .ai .eps
AddIcon /icons/layout.gif .html .shtml .htm .pdf
AddIcon /icons/text.gif .txt
AddIcon /icons/c.gif .c
AddIcon /icons/p.gif .pl .py
AddIcon /icons/f.gif .for
AddIcon /icons/dvi.gif .dvi
AddIcon /icons/uuencoded.gif .uu
AddIcon /icons/script.gif .conf .sh .shar .csh .ksh .tcl
AddIcon /icons/tex.gif .tex
AddIcon /icons/bomb.gif core
AddIcon /icons/back.gif ..
AddIcon /icons/hand.right.gif README
AddIcon /icons/folder.gif ^^DIRECTORY^^
AddIcon /icons/blank.gif ^^BLANKICON^^

# DefaultIcon is which icon to show for files which do not have an icon.
DefaultIcon /icons/unknown.gif

# IndexIgnore is a set of filenames which directory indexing should ignore
# and not include in the listing. Shell-style wildcarding is permitted.
IndexIgnore .??* *~ *# HEADER* README* RCS CVS *,v *,t

# Language defaults.
AddLanguage ca .ca
AddLanguage cs .cz .cs
AddLanguage da .dk
AddLanguage de .de
AddLanguage el .el
AddLanguage en .en
AddLanguage eo .eo
AddLanguage es .es
AddLanguage et .et
AddLanguage fr .fr
AddLanguage he .he
AddLanguage hr .hr
AddLanguage it .it
AddLanguage ja .ja
AddLanguage ko .ko
AddLanguage ltz .ltz
AddLanguage nl .nl
AddLanguage nn .nn
AddLanguage no .no
AddLanguage pl .po
AddLanguage pt .pt
AddLanguage pt-BR .pt-br
AddLanguage ru .ru
AddLanguage sv .sv
AddLanguage zh-CN .zh-cn
AddLanguage zh-TW .zh-tw

# LanguagePriority allows you to give precedence to some languages
# in case of a tie during content negotiation.
LanguagePriority en nl ca cs da de el eo es et fr he hr it ja ko ltz nn no pl pt pt-BR ru sv zh-CN zh-TW
ForceLanguagePriority Prefer Fallback

# Default characterset
AddDefaultCharset UTF-8

# Commonly used filename extensions to character sets.
AddCharset ISO-8859-1  .iso8859-1  .latin1
AddCharset ISO-8859-2  .iso8859-2  .latin2 .cen
AddCharset ISO-8859-3  .iso8859-3  .latin3
AddCharset ISO-8859-4  .iso8859-4  .latin4
AddCharset ISO-8859-5  .iso8859-5  .latin5 .cyr .iso-ru
AddCharset ISO-8859-6  .iso8859-6  .latin6 .arb
AddCharset ISO-8859-7  .iso8859-7  .latin7 .grk
AddCharset ISO-8859-8  .iso8859-8  .latin8 .heb
AddCharset ISO-8859-9  .iso8859-9  .latin9 .trk
AddCharset ISO-2022-JP .iso2022-jp .jis
AddCharset ISO-2022-KR .iso2022-kr .kis
AddCharset ISO-2022-CN .iso2022-cn .cis
AddCharset Big5        .Big5       .big5
AddCharset WINDOWS-1251 .cp-1251   .win-1251
AddCharset CP866       .cp866
AddCharset KOI8-r      .koi8-r .koi8-ru
AddCharset KOI8-ru     .koi8-uk .ua
AddCharset ISO-10646-UCS-2 .ucs2
AddCharset ISO-10646-UCS-4 .ucs4
AddCharset UTF-8       .utf8
AddCharset GB2312      .gb2312 .gb 
AddCharset utf-7       .utf7
AddCharset utf-8       .utf8
AddCharset big5        .big5 .b5
AddCharset EUC-TW      .euc-tw
AddCharset EUC-JP      .euc-jp
AddCharset EUC-KR      .euc-kr
AddCharset shift_jis   .sjis

# For type maps (negotiated resources).
AddHandler type-map var

# To parse .shtml files for server-side includes (SSI).
AddType text/html .shtml
AddOutputFilter INCLUDES .shtml

# The following directives modify normal HTTP response behavior to
# handle known problems with browser implementations.
BrowserMatch "Mozilla/2" nokeepalive
BrowserMatch "MSIE 4\.0b2;" nokeepalive downgrade-1.0 force-response-1.0
BrowserMatch "RealPlayer 4\.0" force-response-1.0
BrowserMatch "Java/1\.0" force-response-1.0
BrowserMatch "JDK/1\.0" force-response-1.0
BrowserMatch "Microsoft Data Access Internet Publishing Provider" redirect-carefully
BrowserMatch "^WebDrive" redirect-carefully
BrowserMatch "^WebDAVFS/1.[012]" redirect-carefully
BrowserMatch "^gnome-vfs" redirect-carefully

# Virtual hosts.
NameVirtualHost *:80
NameVirtualHost *:443

<VirtualHost _default_:80>
    ServerName SERVER_NAME.DOMAIN_NAME
    ServerAlias SERVER_NAME
    ServerAdmin webmaster@DOMAIN_NAME
    DocumentRoot APACHE2_DATA_DIRECTORY
</VirtualHost>

Include sites/*.conf

