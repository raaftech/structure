# APACHE2_CONFIG_DIRECTORY/ssl.conf


# Load module (if neccessary) and set default port.
LoadModule ssl_module APACHE2_MODULES_DIRECTORY/mod_ssl.so
Listen 443

# Global SSL settings.
SSLPassPhraseDialog     builtin
SSLSessionCache         shmcb:/var/cache/mod_ssl/scache(512000)
SSLSessionCacheTimeout  300
SSLMutex                default
SSLRandomSeed           startup file:/dev/urandom  256
SSLRandomSeed           connect builtin
SSLCryptoDevice         builtin
SSLCertificateFile      CERTIFICATES_DATA_DIRECTORY/SERVER_NAME.crt
SSLCertificateKeyFile   CERTIFICATES_DATA_DIRECTORY/SERVER_NAME.key
SSLCipherSuite          ALL:!ADH:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP
SSLVerifyClient         none

# Add default certificate types.
AddType application/x-x509-ca-cert .crt
AddType application/x-pkcs7-crl    .crl

<VirtualHost _default_:443>
    ServerName SERVER_NAME.DOMAIN_NAME
    ServerAlias SERVER_NAME
    ServerAdmin webmaster@DOMAIN_NAME
    DocumentRoot APACHE2_DATA_DIRECTORY

    SSLEngine on

    ErrorLog APACHE2_LOGGING_DIRECTORY/ssl_error_log
    CustomLog APACHE2_LOGGING_DIRECTORY/ssl_request_log "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"
    TransferLog APACHE2_LOGGING_DIRECTORY/ssl_access_log

    # Handle broken clients.
    SetEnvIf User-Agent ".*MSIE.*" nokeepalive ssl-unclean-shutdown downgrade-1.0 force-response-1.0

    # StdEnvVars is expensive. Only enable for dynamic content.
    <Files ~ "\.(cgi|shtml|phtml|php3?)$">
        SSLOptions +StdEnvVars
    </Files>
    <Directory "/var/www/cgi-bin">
        SSLOptions +StdEnvVars
    </Directory>
</VirtualHost>

