
<VirtualHost *:80>
    ServerName www.DOMAIN_NAME
    ServerAlias www
    ServerAdmin webmaster@DOMAIN_NAME
    DocumentRoot APACHE2_SITES_DIRECTORY/www.DOMAIN_NAME

    ErrorLog APACHE2_LOGGING_DIRECTORY/www.DOMAIN_NAME-error_log
    CustomLog APACHE2_LOGGING_DIRECTORY/www.DOMAIN_NAME-access_log common
</VirtualHost>

<VirtualHost *:443>
    ServerName www.DOMAIN_NAME
    ServerAlias www
    ServerAdmin webmaster@DOMAIN_NAME
    DocumentRoot APACHE2_SITES_DIRECTORY/www.DOMAIN_NAME

    SSLEngine on

    ErrorLog APACHE2_LOGGING_DIRECTORY/www.DOMAIN_NAME-error_log
    CustomLog APACHE2_LOGGING_DIRECTORY/www.DOMAIN_NAME-access_log common
</VirtualHost>

