# CFENGINE2_CONFIG_DIRECTORY/cfservd.conf


control:
  domain = ( localdomain )
  TrustKeysFrom = ( CFENGINE2_ALLOWED_RANGES )
  AllowUsers = ( root )

  any::
    IfElapsed = ( 0 )
    ExpireAfter = ( 15 )
    MaxConnections = ( 50 )
    MultipleConnections = ( true )

grant:
   /var/lib/cfengine/masterfiles/inputs *
