# CFENGINE2_CONFIG_DIRECTORY/update.conf

control:
  actionsequence  = ( copy shellcommands tidy )
  domain          = ( localdomain )
  policyhost      = ( cfe.DOMAIN_NAME )

  smtpserver      = ( smtp.DOMAIN_NAME )
  sysadm          = ( root@DOMAIN_NAME )

  master_cfinput  = ( CFENGINE2_DATA_DIRECTORY/masterfiles/inputs )
  repository      = ( CFENGINE2_DATA_DIRECTORY/backups )

  AddInstallable = (
     restart_cfexecd
  )

# Install latest 'cfagent.conf' file to CFENGINE2_CONFIG_DIRECTORY
copy:
   ${master_cfinput}/cfagent.conf dest=CFENGINE2_DATA_DIRECTORY/inputs/cfagent.conf
   mode=0600 backup=false type=checksum trustkey=false
   server=$(policyhost) define=restart_cfexecd

   ${master_cfinput}/update.conf dest=CFENGINE2_DATA_DIRECTORY/inputs/update.conf
   mode=0600 backup=false type=checksum trustkey=false
   server=$(policyhost) define=restart_cfexecd

   $(master_cfinput)/extensions/ dest=CFENGINE2_DATA_DIRECTORY/inputs/extensions/ server=$(policyhost)
   type=checksum ignore=.svn ignore=.*.swp
   recurse=inf mode=700 owner=root group=root purge=true
   
   $(master_cfinput)/templating     dest=CFENGINE2_DATA_DIRECTORY/inputs/templating
                                     r=inf
                                     type=checksum
                                     backup=false
                                     ignore=.svn
                                     ignore=.*.swp
                                     mode=600
                                     trustkey=false
                                     purge=true
                                     server=$(policyhost)


   $(master_cfinput)/config          dest=CFENGINE2_DATA_DIRECTORY/inputs/config
                                     r=inf
                                     type=checksum
                                     backup=false
                                     ignore=.svn
                                     ignore=.*.swp
                                     mode=600
                                     trustkey=false
                                     purge=true
                                     server=$(policyhost)

shellcommands:
   restart_cfexecd::
      "PLATFORM_INIT_DIRECTORY/CFENGINE2_CFEXECD_INIT restart" useshell=true
