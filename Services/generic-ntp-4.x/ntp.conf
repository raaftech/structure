# NTP4_CONFIG_DIRECTORY/ntp.conf


# Don't panic on large clock skews.
tinker panic 0

# The default servers that we consider authorative.
#server 0.nl.pool.ntp.org
#server 1.nl.pool.ntp.org
#server 2.nl.pool.ntp.org

# And/Or take the local system clock seriously.
server 127.127.1.0
fudge 127.127.1.0 stratum 13

# By default, exchange time with everybody, but don't allow configuration.
restrict default kod notrap nomodify nopeer noquery

# Local users may interrogate the ntp server more closely.
restrict 127.0.0.1 nomodify

# Where do we keep our working data?
driftfile NTP4_DATA_DIRECTORY/ntp.drift
statsdir NTP4_DATA_DIRECTORY/stats/
logfile NTP4_LOGGING_DIRECTORY/ntpd.log

# Default statistics gathering.
statistics loopstats peerstats clockstats
filegen loopstats file loopstats type day enable
filegen peerstats file peerstats type day enable
filegen clockstats file clockstats type day enable

# Broadcast time on your local subnet.
#broadcast 192.168.1.255

# And serve our network.
listen on *
