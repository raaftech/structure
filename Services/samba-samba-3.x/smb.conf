# SAMBA3_CONFIG_DIRECTORY/smb.conf


#======================= Global Settings =====================================

[global]

# specify where samba can find its users (smbpasswd tdbsam ldapsam).
# - when using smbpasswd, use smbpasswd -a to add users..
# - when using tdbsam, use pdbedit -a to add users..
# - when using ldapsam, use smbldap-tools to add users..
passdb backend = SAMBA3_PASSDB_BACKEND

# the ldap admin dn password is stored in secrets.tdb
# and is set using "smbpasswd -w passphrase".
# the ldap ssl parameter can be no OR yes OR start tls.
ldap suffix = dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B
ldap user suffix = ou=People
ldap group suffix = ou=Groups
ldap machine suffix = ou=Machines
ldap admin dn = "cn=manager,dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B"
ldap ssl = no
ldap delete dn = yes
ldap passwd sync = yes

# scripts that make life easier
add user script = /usr/sbin/smbldap-useradd -m "%u"
add group script = /usr/sbin/smbldap-groupadd -p "%g"
add machine script = /usr/sbin/smbldap-useradd -w "%u"
delete user script = /usr/sbin/smbldap-userdel "%u"
delete group script = /usr/sbin/smbldap-groupdel "%g"
add user to group script = /usr/sbin/smbldap-groupmod -m "%u" "%g"
delete user from group script = /usr/sbin/smbldap-groupmod -x "%u" "%g"
set primary group script = /usr/sbin/smbldap-usermod -g "%g" "%u"

# workgroup = NT-Domain-Name or Workgroup-Name
workgroup = DOMAIN_NAME

# netbios name
netbios name = SERVER_NAME

# server string is the equivalent of the NT Description field
server string = Samba service on SERVER_NAME

# restrict access to local nets only
hosts allow = 127.0.0.1 SAMBA3_ALLOWED_RANGES

# automatically load your printer list
printing = cups
cups options = raw
printcap name = /etc/printcap
load printers = yes

# all log information in one file
log file = SAMBA3_LOGGING_DIRECTORY/log.smbd

# put a capping on the size of the log files (in Kb).
max log size = 128

# security mode. Most people will want user level security.
security = user
encrypt passwords = yes
smb passwd file = SAMBA3_CONFIG_DIRECTORY/smbpasswd

# unix users can map to different SMB User names
username map = SAMBA3_CONFIG_DIRECTORY/smbusers

# who's guest
guest account = nobody
map to guest = bad user

# gives better performance
socket options = TCP_NODELAY SO_RCVBUF=8192 SO_SNDBUF=8192

# become domain master browser on the network
local master = yes
domain master = yes 
domain logons = yes
preferred master = yes
os level = 33

# run a logon batch file
logon script = logon.bat

# where to store roving profiles (only for Win95 and WinNT)
logon path = \\%L\Profiles\%U

# name resolving
name resolve order = wins lmhosts bcast
wins support = yes
;dns proxy = no 


#============================ Share Definitions ==============================

[homes]
   comment = Home Directories
   browseable = no
   writable = yes
   valid users = %U
   create mask = 0664
   directory mask = 0775

 [netlogon]
   path = SAMBA3_NETLOGON_DIRECTORY
   comment = Network Logon Service
   browsable = no
   writable = no
   share modes = no
   guest ok = yes

[profiles]
   comment = Roaming Profiles
   path = SAMBA3_PROFILES_DIRECTORY
   browseable = no
   writeable = no
   create mask = 0600
   directory mask = 0700
   profile acls = Yes
   csc policy = disable
   force user = %U
   valid users = %U @"Domain Admins"
   write list = %U @"Domain Admins"
   guest ok = yes

[public]
   comment = Public Repository
   path = SAMBA3_DATA_DIRECTORY
   browsable = yes
   writable = no
   public = yes
   read only = yes
   guest ok = yes
   guest only = yes

[printers]
   comment = All Printers
   path = SAMBA3_SPOOLER_DIRECTORY
   browseable = no
   writable = no
   printable = yes

