     <div class="modal-header">
        <h3 class="modal-title">
            <show-icon glyphid="{{instance.glyphId}}" size="sg-xs"></show-icon>
            {{instance.name}} Instance
        </h3>
    </div>
    <div class="modal-body">
        <uib-tabset active="active">
            <uib-tab index="0" heading="Form">
                <div class="alert alert-danger" ng-show="result.error">{{result.error}}</div>
                <div class="alert alert-success" ng-show="result.data">{{result.data}}</div>
                <form name="createInstanceForm"
                      sf-schema="schema"
                      sf-form="form"
                      sf-model="model"
                      ng-submit="showFormValues(createInstanceForm)"></form>
            </uib-tab>
            <uib-tab index="1" heading="Schema"><pre class="pre-scrollable">{{schema | json}}</pre></uib-tab>
        </uib-tabset>
    </div>
