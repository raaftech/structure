# setup.conf - Site Specific Configuration File


# Organizational details
ORGANIZATION_NAME="Example Corporation"     # Full name of your company
ORGANIZATION_DEPARTMENT="Headquarters"      # Full name of your department
ORGANIZATION_CITY="Los Angeles"             # City where the company resides
ORGANIZATION_STATE="CA"                     # Two letter state code 
ORGANIZATION_COUNTRY="US"                   # Two letter country code 

# Setup details
SERVER_NAME="foohost"                       # Hostname of this server
SERVER_ROLE="universal"                     # Anything in the "Roles" directory
SERVER_SUFFIX="1"                           # Domain range + suffix = server IP

# Networking details
#DOMAIN_RANGES="example.com/192.168.0.0/16 frontend/192.168.1.0/24 backend/192.168.2.0/24"  
DOMAIN_RANGES="example.com/192.168.1.0/24"

# Requested host platform and architecture
PLATFORM_NAME="NetBSD"
PLATFORM_RELEASE="4"
PLATFORM_ARCHITECTURE="i386"

