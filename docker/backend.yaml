# backend.yaml - A docker-compose file for the backend services.

# Environment variables:
# DB_NAME
# DB_PASS

version: '3'
services:
  swagger:
    image: swaggerapi/swagger-ui
    ports:
      - "8080:8080"
    environment:
      API_URL: http://localhost:3000/
    depends_on:
      - server

  server:
    image: postgrest/postgrest
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://${DB_NAME}:${DB_PASS}@database:5432/${DB_NAME}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: ${DB_NAME} # TODO: Need to fix this.
    depends_on:
      - database

  database:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASS}
  # volumes:
  #   - "./pgdata:/var/lib/postgresql/data"
