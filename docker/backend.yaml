# backend.yaml - A docker-compose file for the backend services.

# Environment variables:
# PASSWORD

version: '3'
services:
  swagger:
    image: swaggerapi/swagger-ui
    ports:
      - "8080:8080"
    environment:
      API_URL: http://localhost:3000/
    depends_on:
      - server

  server:
    image: postgrest/postgrest
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://structure:${PGPASSWORD}@database:5432/structure
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anonymous
    depends_on:
      - database

  database:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: structure
      POSTGRES_USER: structure
      POSTGRES_PASSWORD: ${PGPASSWORD}
  # volumes:
  #   - "./pgdata:/var/lib/postgresql/data"
