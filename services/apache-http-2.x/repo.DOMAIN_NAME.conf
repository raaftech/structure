
<VirtualHost *:80>
    ServerName repo.DOMAIN_NAME
    ServerAlias repo
    ServerAdmin webmaster@DOMAIN_NAME
    DocumentRoot APACHE2_SITES_DIRECTORY/repo.DOMAIN_NAME

    ErrorLog APACHE2_LOGGING_DIRECTORY/repo.DOMAIN_NAME-error_log
    CustomLog APACHE2_LOGGING_DIRECTORY/repo.DOMAIN_NAME-access_log common
</VirtualHost>

<VirtualHost *:443>
    ServerName repo.DOMAIN_NAME
    ServerAlias repo
    ServerAdmin webmaster@DOMAIN_NAME
    DocumentRoot APACHE2_SITES_DIRECTORY/repo.DOMAIN_NAME

    SSLEngine on

    ErrorLog APACHE2_LOGGING_DIRECTORY/repo.DOMAIN_NAME-error_log
    CustomLog APACHE2_LOGGING_DIRECTORY/repo.DOMAIN_NAME-access_log common
</VirtualHost>

