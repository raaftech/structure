LoadModule dav_svn_module APACHE2_MODULES_DIRECTORY/mod_dav_svn.so

<VirtualHost *:80>
    ServerName svn.DOMAIN_NAME
    ServerAlias svn
    ServerAdmin webmaster@DOMAIN_NAME
    DocumentRoot APACHE2_SITES_DIRECTORY/svn.DOMAIN_NAME

    ErrorLog APACHE2_LOGGING_DIRECTORY/svn.DOMAIN_NAME-error_log
    CustomLog APACHE2_LOGGING_DIRECTORY/svn.DOMAIN_NAME-access_log common

    <Location />
        DAV svn
        SVNPath SUBVERSION1_DATA_DIRECTORY/repository

        # Uncomment this to allow anonymous read access.
        # <LimitExcept GET PROPFIND OPTIONS REPORT>

        AuthType Basic
        AuthName "Subversion Repository"
        #AuthBasicProvider ldap
        #AuthLDAPURL ldap://127.0.0.1/dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B?uid
        #AuthLDAPGroupAttribute memberUid
        #AuthLDAPGroupAttributeIsDN off
        #AuthzLDAPAuthoritative on # if Require ldap-*
        #AuthzLDAPAuthoritative off # if Require valid-user
        #Require ldap-group cn=devel,ou=Groups,dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B
        AuthUserFile SUBVERSION1_DATA_DIRECTORY/svnpasswd
        Require valid-user
        # </LimitExcept>
    </Location>
</VirtualHost>

<VirtualHost *:443>
    ServerName svn.DOMAIN_NAME
    ServerAlias svn
    ServerAdmin webmaster@DOMAIN_NAME
    DocumentRoot APACHE2_SITES_DIRECTORY/svn.DOMAIN_NAME

    SSLEngine on

    ErrorLog APACHE2_LOGGING_DIRECTORY/svn.DOMAIN_NAME-error_log
    CustomLog APACHE2_LOGGING_DIRECTORY/svn.DOMAIN_NAME-access_log common

    <Location />
        DAV svn
        SVNPath SUBVERSION1_DATA_DIRECTORY/repository

        # Uncomment this to allow anonymous read access.
        # <LimitExcept GET PROPFIND OPTIONS REPORT>

        # Require SSL connection for password protection.
        SSLRequireSSL

        AuthType Basic
        AuthName "Subversion Repository"
        #AuthBasicProvider ldap
        #AuthLDAPURL ldap://127.0.0.1/dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B?uid
        #AuthLDAPGroupAttribute memberUid
        #AuthLDAPGroupAttributeIsDN off
        #AuthzLDAPAuthoritative on # if Require ldap-*
        #AuthzLDAPAuthoritative off # if Require valid-user
        #Require ldap-group cn=devel,ou=Groups,dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B
        AuthUserFile SUBVERSION1_DATA_DIRECTORY/svnpasswd
        Require valid-user
        # </LimitExcept>
    </Location>
</VirtualHost>
