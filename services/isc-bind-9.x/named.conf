# This is the primary configuration file for the BIND DNS server named.
# To just add zones, do that in BIND9_DATA_DIRECTORY/named.conf.local

include "BIND9_DATA_DIRECTORY/named.conf.options";

# Prime the server with knowledge of root servers.
zone "." {
	type hint;
	file "default/db.root";
};

# Be authoritative for the localhost forward and reverse zones and for
# the broadcast zones as per RFC 1912.
zone "localhost" {
	type master;
	file "default/db.local";
};

zone "127.in-addr.arpa" {
	type master;
	file "default/db.127";
};

zone "0.in-addr.arpa" {
	type master;
	file "default/db.0";
};

zone "255.in-addr.arpa" {
	type master;
	file "default/db.255";
};

# Include the local zone configuration.
include "BIND9_DATA_DIRECTORY/named.conf.local";

