# OPENLDAP2_CONFIG_DIRECTORY/ldap.conf

#host ldap.DOMAIN_NAME
base dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B
#uri ldap://ldap.DOMAIN_NAME/   
uri ldaps://ldap.DOMAIN_NAME/   
#binddn uid=proxyuser,ou=Services,dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B
#bindpw secret
#rootbinddn cn=manager,dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B
#port 4389
ssl on
#sslpath CERTIFICATES_DATA_DIRECTORY/cert7.db
tls_reqcert allow
tls_checkpeer no
tls_cacertdir OPENLDAP2_CONFIG_DIRECTORY/cacerts
#tls_cacertfile CERTIFICATES_DATA_DIRECTORY/ldap.crt
#tls_randfile /var/run/egd-pool
#tls_ciphers TLSv1
#tls_cert
#tls_key
timelimit 60
bind_policy soft
bind_timelimit 10
idle_timelimit 3600
pam_lookup_policy yes
#pam_check_host_attr yes
#pam_check_service_attr yes
#pam_groupdn cn=PAM,ou=Groups,dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B
#pam_member_attribute memberURL
#pam_template_login_attribute uid
pam_password ssha
#pam_password_prohibit_message Visit http://internal to change your password.
nss_initgroups_ignoreusers root,ldap,named,avahi,haldaemon
nss_reconnect_tries 4
nss_reconnect_sleeptime 1
nss_reconnect_maxsleeptime 16
nss_reconnect_maxconntries 2
nss_base_passwd	ou=People,dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B?one
nss_base_shadow	ou=People,dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B?one
nss_base_group	ou=Groups,dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B?one
#nss_base_hosts		ou=Hosts,dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B?one
#nss_base_services	ou=Services,dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B?one
#nss_base_networks	ou=Networks,dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B?one
#nss_base_protocols	ou=Protocols,dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B?one
#nss_base_rpc		ou=Rpc,dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B?one
#nss_base_ethers	ou=Ethers,dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B?one
#nss_base_netmasks	ou=Networks,dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B?ne
#nss_base_bootparamsou=Ethers,dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B?one
#nss_base_aliases	ou=Aliases,dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B?one
#nss_base_netgroup	ou=Netgroup,dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B?one
#nss_map_attribute	rfc2307attribute	mapped_attribute
#nss_map_objectclassrfc2307objectclass	mapped_objectclass
#nss_map_attribute uniqueMember member
