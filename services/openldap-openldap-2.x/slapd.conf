# OPENLDAP2_CONFIG_DIRECTORY/slapd.conf

# Included schema(s).
include     OPENLDAP2_CONFIG_DIRECTORY/schema/core.schema
include     OPENLDAP2_CONFIG_DIRECTORY/schema/cosine.schema
include     OPENLDAP2_CONFIG_DIRECTORY/schema/inetorgperson.schema
include     OPENLDAP2_CONFIG_DIRECTORY/schema/nis.schema
include     OPENLDAP2_CONFIG_DIRECTORY/schema/samba.schema

# Added logging parameters. Use loglevel 296 for debugging.
loglevel    0
pidfile     OPENLDAP2_STATE_DIRECTORY/slapd.pid
argsfile    OPENLDAP2_STATE_DIRECTORY/slapd.args

# Referrals.
#referral   ldap://root.openldap.org

# Load dynamic backend modules:
modulepath  OPENLDAP2_MODULES_DIRECTORY
moduleload  back_OPENLDAP2_BACKEND_TYPE

# TLS/SSL parameters.
TLSCertificateFile      CERTIFICATES_DATA_DIRECTORY/ldap.crt
TLSCertificateKeyFile   CERTIFICATES_DATA_DIRECTORY/ldap.key

# Miscellaneous security options.
#security   update_sasl=128 update_tls=128
password-hash {SSHA}
 
# Various compatibility options
allow bind_v2

#######################################################################
# Access control lists
#######################################################################

# Restrict passwords to be used for authentication only and allow users
# to modify their own passwords after authentication.
access to attrs=userPassword,shadowLastChange,sambaNTPassword,sambaLMPassword,sambaPwdMustChange,sambaPwdLastSet
       by self write
       by anonymous auth
       by * none

# By default the world can read our tree.
access to dn.subtree="dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B"
       by * read

#######################################################################
# Database definitions.
#######################################################################

# Database settings. Set rootpw with "slappasswd -h {SSHA} -s mypass"
database    OPENLDAP2_BACKEND_TYPE
suffix      "dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B"
rootdn      "cn=manager,dc=DOMAIN_NAME_PART_A,dc=DOMAIN_NAME_PART_B"
rootpw      {SSHA}aRamcuuvDGI9ZboE+P4DbykzeF/vawhE
directory   OPENLDAP2_DATA_DIRECTORY
mode        0600
cachesize   1024

# Indices to maintain.
index   objectClass,uidNumber,gidNumber eq
index   cn,sn,uid,displayName pres,sub,eq
index   memberUid,mail,givenname eq,subinitial
index   sambaSID,sambaPrimaryGroupSID,sambaDomainName eq

