<form class="sidebar-form" ng-controller="searchCtrl">
    <div class="input-group">
        <input ng-model="query" type="text" class="form-control" placeholder="Search..." ng-keyup="startSearch()">
        <span class="input-group-btn">
            <button ng-click="startSearch()" type="button" class="btn btn-default">
                <span class="glyphicon glyphicon-search" aria-hidden="true"></span>
            </button>
        </span>
    </div>
</form>
