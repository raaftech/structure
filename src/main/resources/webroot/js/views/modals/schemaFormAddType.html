<div class="modal-header">
  <h3 class="modal-title">Add new type</h3>
</div>
<div class="modal-body">
  <uib-tabset active="active">
    <uib-tab index="0" heading="Form">
      <form
        name="addTypeForm"
        sf-schema="schema"
        sf-form="form"
        sf-model="model"
        ng-submit="addType(addTypeForm)"
      ></form>
    </uib-tab>
    <uib-tab index="1" heading="Schema"><pre class="pre-scrollable">{{schema | json}}</pre></uib-tab>
  </uib-tabset>
</div>
