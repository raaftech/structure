<div ng-controller="iconCtrl" ng-init="getNamesAndGlyphs()">
    <ul class="names-and-glyphs">
        <li ng-repeat="nameAndGlyph in namesAndGlyphs | orderBy: 'name'">
            <name-and-glyph name="{{nameAndGlyph.name}}" glyph="{{nameAndGlyph.glyph}}"></name-and-glyph>
        </li>
    </ul>
</div>
