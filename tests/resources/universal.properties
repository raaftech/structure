# universal.home: Universal home directory. If this variable is not set, the
# application will set univeral.home to 'user.dir', which is usually fine. If
# you set this, make sure you always use forward slashes (on windows too).
#
# universal.home = /some/dir


# universal.graph.dbtype: Controls which graph database backend is used. For now
# the only valid backend is 'titan'. If not set, the application will
# default to using Titan.
#
# universal.graph.dbtype = titan


# universal.graph.dbhome: This controls where we store the Titan database
# files. By default this is {universal.home}/db. If path is absolute, it
# points simply to that path. If path is relative (like 'foodb'), the path
# is relative to {universal.home}.
#
universal.graph.dbhome=target/test-titandb


# universal.graph.dbindex: This controls which indexer backend the Titan
# database uses. Titan has an internal indexing backend that is fast but
# somehwhat limited in features, and can use a secondary indexer backend
# which can for example match case-insensitively. If this value is not
# set, the application chooses 'es' (Elastic Search) by default. For now
# the only other valid option is 'lucene'.
#
# universal.graph.dbindex = es
