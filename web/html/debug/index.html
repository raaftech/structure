<!DOCTYPE html>
<html ng-app="universal">
<head>
<meta charset="utf-8">
<link rel="stylesheet"
	href="js/libs/bootstrap/dist/css/bootstrap.css">
<link rel="stylesheet" href="css/style.css">
<script type="text/javascript"
	src="js/libs/sockjs-client/dist/sockjs.js"></script>
<script type="text/javascript" src="js/libs/vertxbus.js/index.js"></script>
<script type="text/javascript" src="js/libs/angular/angular.min.js"></script>
<script type="text/javascript"
	src="js/libs/angular-vertxbus/dist/angular-vertxbus.min.js"></script>
<script type="text/javascript" src="js/libs/jquery/dist/jquery.min.js"></script>
<script type="text/javascript" src="js/libs/bootstrap/dist/js/bootstrap.min.js"></script>
<script type="text/javascript" src="js/app.js"></script>
</head>
<body>
	<div class="appContainer" ng-controller="ContainerController as containerCtrl">
		<ul class="nav nav-pills">
			<li role="presentation" ng-class="{ active:containerCtrl.isSelected(1) }"><a href="#" ng-click="containerCtrl.changeTab(1)">Create
					TemplateNode</a></li>
			<li role="presentation" ng-class="{ active:containerCtrl.isSelected(2) }"><a href="#" ng-click="containerCtrl.changeTab(2)">View Templates</a></li>
		</ul>
		<div id="templateForm"
			ng-controller="TemplateController as templateCtrl" ng-show="containerCtrl.isSelected(1)">
			<form name="newTemplateForm"
				ng-submit="newTemplateForm.$valid && templateCtrl.createNewTemplate()"
				novalidate>
				<h4>Create a new Template</h4>
				<fieldset class="form-group">
					<input ng-model="newTemplate.parent" class="form-control"
						type="text" placeholder="The UUID of the parent.">
				</fieldset>
				<fieldset class="form-group">
					<input ng-model="newTemplate.isa" class="form-control" type="text"
						placeholder="The UUID of the TypeNode." required>
				</fieldset>
				<fieldset class="form-group">
					<input ng-model="newTemplate.name" class="form-control" type="text"
						placeholder="The name of the template." required>
				</fieldset>
				<fieldset class="form-group">
					<textarea ng-model="newTemplate.desc" class="form-control"
						placeholder="A description of the template." required></textarea>
				</fieldset>
				<fieldset class="form-group">
					<input ng-model="newTemplate.uuid" class="form-control" type="text"
						placeholder="The resulting UUID of the new TemplateNode." readonly>
				</fieldset>
				<fieldset class="form-group">
					<div class="checkbox container-fluid">
						<div class="col-md-4">
							<label><input ng-model="newTemplate.start"
								ng-click="templateCtrl.clickStart()" type="checkbox">
								start</label>
						</div>
						<div class="col-md-4">
							<label><input ng-model="newTemplate.required"
								type="checkbox"> required</label>
						</div>
						<div class="col-md-4">
							<label><input ng-model="newTemplate.unique"
								type="checkbox"> unique</label>
						</div>
					</div>
				</fieldset>
				<div ng-show="submitSucceeded.flag" class="alert alert-success"
					role="alert">
					<button type="button" class="close" data-dismiss="alert"
						aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
					{{ submitSucceeded.message }}
				</div>
				<div ng-show="submitError.flag" class="alert alert-danger"
					role="alert">
					<button type="button" class="close" data-dismiss="alert"
						aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
					{{ submitError.message }}
				</div>
				<fieldset class="form-group">
					<input class="btn btn-primary pull-right" type="submit"
						value="Create Template">
				</fieldset>
			</form>
		</div>
		<div id="templateView" ng-show="containerCtrl.isSelected(2)">
			<strong>foo</strong>
		</div>
	</div>
</body>
</html>
