<html>
    <head>
        <title>Debug</title>
        <meta charset="utf-8">
        <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/0.3.4/sockjs.min.js"></script>
        <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/vertx/2.0.0/vertxbus.min.js"></script>
        <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
        <script src="client.js"></script>
    </head>
    <body>
        <p>
            <h1>Universal debug screen</h1>
            <p>Used to test/simulate user interaction with Universal over the eventbus.</p>
            <h2>Actions</h2>
            <a href="javascript:startUpdate();">Update</a><br>
            <a href="javascript:createInstanceNode();">Create InstanceNode</a>
            <p>
                <h2>Find TypeNode</h2>
                <form action="#" onsubmit="javascript:findTypeNode(document.getElementById('nameOfTypeNode').value)">
                    Name: <input type="text" id="nameOfTypeNode"><button type="submit" >Find TypeNode</button>
                </form>
                <p><table border="1">
                    <tr>
                        <td>name</td>
                        <td><div id="typeNodeName">Placeholder</div></td>
                    </tr>
                    <tr>
                        <td>uuid</td>
                        <td><div id="typeNodeUuid">Placeholder</div></td>
                    </tr>
                    <tr>
                        <td>desc</td>
                        <td><div id="typeNodeDesc">Placeholder</div></td>
                    </tr>
                    <tr>
                        <td>parent</td>
                        <td><div id="typeNodeIsa">Placeholder</div></td>
                    </tr>
                </table></p>
            </p>
            <p>
                <h2>Create instance of found TypeNode</h2>
                <div id="createInstance"></div>
            </p>
            <p>
                <h2>Find InstanceNode</h2>
                <form action="#" onsubmit="javascript:findInstanceNode(document.getElementById('nameOfInstanceNode').value)">
                    Name: <input type="text" id="nameOfInstanceNode"><button type="submit" >Find InstanceNode</button>
                </form>
                <p><table border="1" id="instanceNodeResult">
                    <!--<tr>
                        <td>name</td>
                        <td><div id="instanceNodeName">Placeholder</div></td>
                    </tr>
                    <tr>
                        <td>uuid</td>
                        <td><div id="instanceNodeUuid">Placeholder</div></td>
                    </tr>
                    <tr>
                        <td>desc</td>
                        <td><div id="instanceNodeDesc">Placeholder</div></td>
                    </tr>-->
                </table></p>
        </p>
    </body>
</html>
