<!DOCTYPE html>
<html lang="en" ng-app="structure">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard Template for Bootstrap</title>

    <!-- Bootstrap core CSS -->
    <link href="js/vendor/bootstrap/dist/css/bootstrap.css" rel="stylesheet">

    <!-- Custom styles for this template -->
	<link href="css/structure.css" rel="stylesheet">

	<script type="text/javascript" src="js/vendor/sockjs-client/dist/sockjs.js"></script>
	<script type="text/javascript" src="js/vendor/vertx3-eventbus-client/vertxbus.js"></script>
	<script type="text/javascript" src="js/vendor/angular/angular.min.js"></script>
	<script type="text/javascript" src="js/vendor/angular-route/angular-route.min.js"></script>
	<script type="text/javascript" src="js/vendor/angular-sanitize/angular-sanitize.min.js"></script>
	<script type="text/javascript" src="js/vendor/tv4/tv4.js"></script>
	<script type="text/javascript" src="js/vendor/objectpath/lib/ObjectPath.js"></script>

	<script type="text/javascript" src="js/vendor/angular-schema-form/dist/schema-form.min.js"></script>
	<script type="text/javascript" src="js/vendor/angular-schema-form/dist/bootstrap-decorator.min.js"></script>
	<script type="text/javascript" src="js/vendor/angular-vertxbus/dist/angular-vertxbus.min.js"></script>
	<script type="text/javascript" src="js/vendor/jquery/dist/jquery.min.js"></script>
	<script type="text/javascript" src="js/vendor/bootstrap/dist/js/bootstrap.min.js"></script>

	<script type="text/javascript" src="js/structure.js"></script>
  </head>

  <body>

    <nav class="navbar navbar-inverse navbar-fixed-top">
      <div class="container-fluid">
        <div class="navbar-logo"></div>
        <div class="navbar-header">
          <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar" aria-expanded="false" aria-controls="navbar">
            <span class="sr-only">Toggle navigation</span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
          </button>
          <a class="navbar-brand" href="#/">Structure</a>
        </div>
        <div id="navbar" class="navbar-collapse collapse">
          <ul class="nav navbar-nav navbar-right">
            <li><a href="#dashboard">Dashboard</a></li>
            <li><a href="#templates">Templates</a></li>
            <li><a href="#settings">Settings</a></li>
            <li><a href="#profile">Profile</a></li>
            <li><a href="#help">Help</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container-fluid" ng-controller="HandleController as handleCtrl">
      <div class="row">
        <div class="col-sm-3 col-md-2 sidebar">
          <form class="sidebar-form">
            <div class="input-group">
              <input ng-model="findInstanceNodeUuid" type="text" class="form-control" placeholder="Search...">
              <span class="input-group-btn">
                <button ng-click="handleCtrl.findInstanceNode()" type="button" class="btn btn-default">
                  <span class="glyphicon glyphicon-search" aria-hidden="true"></span>
                </button>
              </span>
            </div>
          </form>
          <ul class="nav nav-sidebar">
            <li class="active"><a href="#">Overview <span class="sr-only">(current)</span></a></li>
            <li><a href="">Reports</a></li>
            <li><a href="">Analytics</a></li>
            <li><a href="">Export</a></li>
          </ul>
          <ul class="nav nav-sidebar">
            <li><a href="">Nav item</a></li>
            <li><a href="">Nav item again</a></li>
            <li><a href="">One more nav</a></li>
            <li><a href="">Another nav item</a></li>
            <li><a href="">More navigation</a></li>
          </ul>
          <div ng-controller="testController">{{ version }}</div>
        </div>
        <div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 main">
          <div ng-view></div>
        </div>
      </div>
    </div>
  </body>
</html>
