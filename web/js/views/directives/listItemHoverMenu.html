<div ng-click="menuClicked = true"><span class="glyphicon glyphicon-menu-hamburger" aria-hidden="true"></span></div>
<ul class="tools" ng-show="menuClicked && nodeType=='TemplateNode'" ng-mouseleave="menuClicked = false">
    <li><a href="#{{uuid}}">Remove</a></li>
    <li><a href="#{{uuid}}">Rename</a></li>
    <li><a ng-click="open(uuid)">Preview</a></li>
</ul>
<ul class="tools" ng-show="menuClicked && nodeType=='TypeNode'" ng-mouseleave="menuClicked = false">
    <li><a href="#{{uuid}}">Start</a></li>
    <li><a href="#{{uuid}}">Stop</a></li>
    <li><a href="#{{uuid}}">Edit</a></li>
    <li><a href="#{{uuid}}">Remove</a></li>
    <li><a ng-click="open(uuid)">Create instance</a></li>
</ul>
