    <div class="modal-header" ng-init="getType(uuid)">
        <h3 class="modal-title">{{type.name}}</h3>
    </div>
    <div class="modal-body">
        <div class="alert alert-danger" ng-show="result.error">{{result.error}}</div>
        <div class="alert alert-success" ng-show="result.data">{{result.data}}</div>
        <p>Create instance of type {{type.name}}.</p>
        <!--Create form with schema of clicked type.-->
        <form sf-schema="schema" sf-form="form" sf-model="model"></form>
    </div>
    <div class="modal-footer">
        <button class="btn btn-primary" type="button" ng-click="showFormValues()">OK</button>
        <button class="btn btn-warning" type="button" ng-click="cancel()">Cancel</button>
    </div>
