<div class="modal-header">
    <h3 class="modal-title">
        <show-icon glyphid="{{model.glyphId}}" size="sg-xs"></show-icon>
        {{model.name}}
    </h3>
</div>
<div class="modal-body">
    <uib-tabset active="active">
        <uib-tab index="0" heading="Form">
            <form name="editTypeForm"
                  sf-schema="schema"
                  sf-form="form"
                  sf-model="model"
                  ng-submit="saveType(editTypeForm)"></form>
        </uib-tab>
        <uib-tab index="1" heading="Schema"><pre class="pre-scrollable">{{schema | json}}</pre></uib-tab>
    </uib-tabset>
</div>
