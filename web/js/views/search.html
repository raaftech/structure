<div ng-controller="searchResultCtrl">
    <h1>Search results</h1>
    <p>Show results for: <strong>{{data.query}}</strong></p>
    <div class="alert alert-danger" ng-show="data.error">{{data.error}}</div>
    <div class="table-responsive" ng-show="data.results.length > 0">
        <table class="table list">
            <thead>
                <tr>
                    <th class="col-xs-4">Name</th>
                    <th class="col-xs-4">Description</th>
                    <th class="col-xs-4">UUID</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="result in data.results | orderBy: 'name'" ng-mouseenter="menuButton = true" ng-mouseleave="menuButton = false">
                    <td ng-click="getType(result.uuid)">{{result.name}}</td>
                    <td ng-click="getType(result.uuid)">{{result.desc}}</td>
                    <td ng-click="getType(result.uuid)"><list-item-hover-menu ng-show="menuButton" uuid="{{result.uuid}}"></list-item-hover-menu>{{result.uuid}}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
