<div ng-controller="typeCtrl" ng-init="getType('a79ce509-a021-4177-ae61-73abd01fb479')">
    <div ng-show="type.name" class="row detailed-info">
        <div class="basic">
            <div class="body">
                <img src="/img/logo_dummy.png" align="left" border="0" />
                <h1>{{type.name}}</h1>
                <p>{{type.desc}}</p>
                <p ng-controller="modalCtrl">
                    <button type="button" class="btn button-str" ng-click="open(type.uuid)">Edit</button>
                    <button type="button" class="btn button-transparent">...</button>
                </p>
            </div>
        </div>
        <div class="detail">
            <ul>
                <h2>Details</h2>
                <li><label>Name</label>{{type.name}}</li>
                <li><label>Description</label>{{type.desc}}</li>
                <li><label>UUID</label>{{type.uuid}}</li>
                <li><label>ISA</label>{{isa.name}}</li>
            </ul>
        </div>
    </div>
    <div ng-repeat="type in types | orderBy: 'name'">
        <div class="table-responsive">
            <table class="table list">
                <thead>
                    <tr ng-mouseenter="topMenuButton = true" ng-mouseleave="topMenuButton = false">
                        <th><span ng-class="{'open': (subtypes[type.uuid] && type.children != '[]'), 'closed': (!subtypes[type.uuid] && type.children != '[]')}" ng-click="getSubtypes(type)"></span><span ng-click="getType(type.uuid)">{{type.name}}</span></th>
                        <th>{{subtypes[type.uuid].length ? 'Description': '&nbsp;'}}</th>
                        <th>{{subtypes[type.uuid].length ? 'UUID': '&nbsp;'}}</th>
                        <th width="35"><list-item-hover-menu ng-show="topMenuButton" uuid="{{type.uuid}}" node-type="{{type._nodeType}}" /></th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="subtype in subtypes[type.uuid] | orderBy: 'name'" ng-mouseenter="menuButton = true" ng-mouseleave="menuButton = false">
                        <td ng-click="getType(subtype.uuid)">{{subtype.name}}</td>
                        <td ng-click="getType(subtype.uuid)">{{subtype.desc}}</td>
                        <td ng-click="getType(subtype.uuid)">{{subtype.uuid}}</td>
                        <td><list-item-hover-menu ng-show="menuButton" uuid="{{subtype.uuid}}" node-type="{{subtype._nodeType}}" /></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
